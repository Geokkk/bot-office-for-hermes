<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bot Office · Hermes 办公室（真数据版）</title>
<style>
  /* UI v4 — photoreal diorama: the building is a Blender/Cycles render
     (office.png, transparent backdrop over the page sky). Live data is
     overlaid at surveyed anchor points: working models sit at desks,
     idle models lie in dorm beds, static residents stand in life zones,
     host readings sit on the basement LCD panel. Bright daytime only. */
  :root{
    --ink:#4a3826; --dim:#8a765c; --faint:#b3a284;
    --teal:#2ea88a; --red:#e0655f; --green:#2fbf71;
    --line:#e7dabf; --shadow:0 10px 26px rgba(90,60,30,.16);
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:linear-gradient(180deg,#6fb7ef 0%,#a8d8f8 34%,#d8f0ff 68%,#eef9ff 100%);
    color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:18px 16px 24px; position:relative; overflow-x:hidden;
  }
  .sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .cloud{position:absolute;background:#fff;border-radius:999px;opacity:.8;filter:blur(1px);
    animation:drift 90s linear infinite}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud::before{width:55%;height:170%;left:14%;top:-95%}
  .cloud::after{width:38%;height:120%;right:12%;top:-60%}
  @keyframes drift{from{transform:translateX(-6vw)}to{transform:translateX(6vw)}}
  .app{max-width:1180px;margin:0 auto;position:relative;z-index:1}

  header.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.82));
    border:1.5px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:var(--shadow);
    padding:10px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
  .brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:2px;color:var(--ink)}
  .brand h1 .accent{color:var(--teal)}
  .brand p{margin:0;font-size:10.5px;color:var(--dim);letter-spacing:.6px}
  .counts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto;
    font-size:12.5px;color:var(--dim)}
  .counts b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums;padding:0 1px}
  .counts .sep{color:var(--faint)}
  .linkchip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;
    color:var(--ink);background:#eef7ee;border:1.5px solid #cfe6cf;border-radius:999px;padding:4px 11px}
  .linkchip .dot{width:8px;height:8px;border-radius:50%;background:var(--green);
    box-shadow:0 0 7px rgba(47,191,113,.8);animation:pulse-dot 1.8s ease-in-out infinite}
  .linkchip.off{background:#fdeeee;border-color:#f3cccc;color:#a03a36}
  .linkchip.off .dot{background:var(--red);box-shadow:0 0 6px rgba(224,101,95,.6);animation:none}
  @keyframes pulse-dot{50%{opacity:.35}}
  .auth-hint{display:none;margin-top:12px;padding:11px 16px;border-radius:12px;
    background:#fdeeee;border:1.5px solid #e8a09c;color:#a03a36;
    font-size:12.5px;font-weight:700;letter-spacing:.4px;box-shadow:var(--shadow)}
  .auth-hint.show{display:block}

  /* ---------- stage: render + overlay ---------- */
  .scene-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:14px;
    padding:4px 2px 10px;scrollbar-width:thin}
  .stage{position:relative;min-width:920px;aspect-ratio:1800/990;border-radius:14px}
  .stage::before{content:"";position:absolute;left:6%;right:6%;bottom:1.2%;height:5.5%;
    background:radial-gradient(50% 50% at 50% 50%,rgba(70,50,25,.35),transparent 70%);
    filter:blur(6px);z-index:0}
  .bldg{position:absolute;inset:0;width:100%;height:100%;z-index:1;user-select:none;-webkit-user-drag:none}
  .ovl{position:absolute;inset:0;z-index:2}

  .chip{position:absolute;transform:translateY(-50%);z-index:6;white-space:nowrap;
    background:rgba(255,255,255,.85);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    border:1px solid rgba(140,110,70,.35);color:#5a4632;font-size:11px;font-weight:800;
    letter-spacing:2px;padding:3px 10px;border-radius:6px;box-shadow:0 2px 6px rgba(90,60,30,.18)}
  .chip .sub{letter-spacing:.4px;font-weight:600;color:var(--dim);font-size:9.5px;margin-left:5px}
  .chip.clickable{cursor:pointer}
  .note{position:absolute;transform:translate(-50%,-50%);z-index:6;white-space:nowrap;
    font-size:11px;color:#6a573f;letter-spacing:1px;background:rgba(255,255,255,.72);
    border:1px dashed rgba(140,110,70,.4);border-radius:8px;padding:4px 12px}
  .note.alert{color:#a03a36;border-color:#e8a09c;background:rgba(255,243,242,.85);font-weight:700}

  /* ---------- entourage figures (soft-shaded, no facial features) ---------- */
  .fig{position:absolute;transform:translate(-50%,-100%);z-index:5;background:none;border:none;
    padding:0;cursor:pointer;font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
  .fig:focus-visible,.sleeper:focus-visible,.lcd-panel:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .fig-in{position:relative;display:block;width:100%}
  .fig.stand{width:3.9%}
  .fig.stand .fig-in{aspect-ratio:.62}
  .fig.seated{width:4.2%}
  .fig.seated .fig-in{aspect-ratio:.78}
  .fig.persona .fig-in{aspect-ratio:auto}
  .chibi{position:absolute;inset:0}
  .chibi svg{width:100%;height:100%;display:block}
  .chead{position:absolute;top:-24%;left:50%;transform:translateX(-50%);width:23%}
  .chead svg{width:100%;display:block}
  .fig .ahead{position:absolute;top:0;left:50%;transform:translateX(-50%);width:57%;aspect-ratio:1;
    border-radius:50%;box-shadow:inset -2px -3px 5px rgba(120,70,30,.25), 0 1px 2px rgba(60,40,20,.25);z-index:2}
  .fig .ahair{position:absolute;top:-6%;left:1%;right:1%;height:54%;border-radius:999px 999px 32% 32%}
  .fig .abody{position:absolute;left:50%;transform:translateX(-50%);width:94%;z-index:1;
    box-shadow:inset -3px -6px 7px rgba(0,0,0,.18), inset 2px 3px 5px rgba(255,255,255,.25)}
  .fig.stand .abody{top:25%;height:47%;border-radius:44% 44% 14% 14%/34% 34% 10% 10%}
  .fig.seated .abody{top:27%;height:66%;border-radius:44% 44% 16% 16%/30% 30% 10% 10%}
  .fig .alegs{position:absolute;bottom:0;left:0;right:0;height:28%;z-index:0}
  .fig .alegs i{position:absolute;bottom:0;width:21%;height:100%;border-radius:0 0 4px 4px;
    background:linear-gradient(180deg,#5a6a86,#3c4656)}
  .fig .alegs i:first-child{left:17%}
  .fig .alegs i:last-child{right:17%}
  .fig::after{content:"";position:absolute;bottom:-2.5%;left:50%;transform:translateX(-50%);
    width:120%;height:5%;border-radius:50%;background:rgba(80,55,25,.22);filter:blur(1.5px);z-index:0}
  .fig.seated::after{display:none}
  .fig .halo{position:absolute;bottom:-9%;left:50%;transform:translateX(-50%);width:190%;height:26%;
    border-radius:50%;background:radial-gradient(rgba(46,168,138,.5),transparent 70%);z-index:0;
    animation:glow-pulse 2.2s ease-in-out infinite}
  @keyframes glow-pulse{50%{opacity:.45}}
  .fig.working .fig-in{animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-3.5%)}}
  .fig.resident .fig-in{animation:sway 3.8s ease-in-out infinite;transform-origin:50% 100%}
  @keyframes sway{0%,100%{transform:rotate(-1.1deg)}50%{transform:rotate(1.1deg)}}
  .tag{position:absolute;bottom:103%;left:50%;transform:translateX(-50%);z-index:7;max-width:190px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(255,255,255,.94);
    border:1px solid #d8c9a8;color:var(--ink);font-size:10px;font-weight:700;letter-spacing:.3px;
    border-radius:999px;padding:2px 8px;box-shadow:0 2px 5px rgba(90,60,30,.22)}
  .tag .wdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--teal);
    margin-right:4px;vertical-align:1px;box-shadow:0 0 5px rgba(46,168,138,.9)}

  /* ---------- sleepers in dorm beds ---------- */
  .sleeper{position:absolute;transform:translate(-50%,-50%);width:8.8%;z-index:5;background:none;
    border:none;padding:0;cursor:pointer;font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
  .sleeper-in{position:relative;display:block;width:100%;aspect-ratio:3.1}
  .sleeper .capsule{position:absolute;left:0;right:0;top:30%;height:64%;border-radius:999px;
    box-shadow:inset 0 4px 6px rgba(255,255,255,.35), inset 0 -5px 7px rgba(0,0,0,.22),
    0 3px 5px rgba(80,55,25,.25)}
  .sleeper .shead{position:absolute;top:-4%;left:50%;transform:translateX(-50%);width:19%;aspect-ratio:1;
    border-radius:50%;box-shadow:inset -1.5px -2.5px 4px rgba(120,70,30,.25);z-index:2}
  .sleeper .shead .ahair{position:absolute;top:-6%;left:1%;right:1%;height:54%;border-radius:999px 999px 32% 32%}
  .sleeper .tag{bottom:112%;max-width:118px;font-size:9.5px;padding:1.5px 6px}

  /* persona medallions (model families with character art) */
  .fig.persona{width:5.4%}
  .fig.persona.seated{width:5.8%}
  .pava{position:relative;display:block;width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;
    border:2.5px solid #fff;box-shadow:0 4px 10px rgba(31,58,95,.35);background:#dfe9f2}
  .pava img{width:100%;height:100%;object-fit:cover;display:block}
  .fig.working .pava{border-color:#8ef0d2;box-shadow:0 0 0 3px rgba(46,184,154,.5),0 4px 12px rgba(31,58,95,.35)}
  .fig.persona .tag{bottom:105%}
  .sleeper.persona-s{width:4.7%}
  .sleeper.persona-s .sleeper-in{aspect-ratio:auto}
  .sleeper.persona-s .pava img{filter:saturate(.72) brightness(.93)}
  .sleeper.persona-s .tag{bottom:104%;max-width:130px}
  .sleeper.persona-s .zzz{top:-16px;right:-12px}
  .music-on .dispatch-fig .fig-in{animation-duration:.95s}

  /* ---------- office radio: local music player ---------- */
  .player{position:absolute;z-index:8;left:58.889%;top:29.798%;transform:translate(-50%,-50%);
    display:flex;align-items:center;gap:7px;max-width:132px;
    background:rgba(255,255,255,.85);border:1.5px solid rgba(255,255,255,.95);border-radius:999px;
    padding:4px 10px 4px 4px;box-shadow:0 6px 16px rgba(31,58,95,.18);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .pbtn{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;flex:none;
    background:linear-gradient(145deg,#35c4a0,#1f9d84);color:#fff;font-size:15px;
    display:grid;place-items:center;box-shadow:0 3px 8px rgba(31,157,132,.4)}
  .pbtn .eq{display:none;align-items:flex-end;gap:2px;height:12px}
  .pbtn .eq i{width:3px;background:#fff;border-radius:2px;animation:eqb .7s ease-in-out infinite}
  .pbtn .eq i:nth-child(2){animation-delay:.18s}.pbtn .eq i:nth-child(3){animation-delay:.36s}
  @keyframes eqb{0%,100%{height:4px}50%{height:12px}}
  .player.playing .pbtn .eq{display:flex}
  .player.playing .pbtn .note-ic{display:none}
  .note-box{margin-top:12px;background:#f4efe0;border:1px solid #e9dfc2;border-radius:10px;padding:8px 10px;font-size:11px;color:#7a6c46;line-height:1.55}
  .hist{margin-top:10px;max-height:248px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px}
  .hrow{position:relative;padding:7px 10px;border:1px solid #f0e6cf;border-radius:10px;background:#fffdf6}
  .ht{font-size:12.5px;font-weight:700;color:var(--ink);padding-right:56px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hm{font-size:10.5px;color:var(--dim);margin-top:2px}
  .hbadge{position:absolute;top:8px;right:8px;font-size:9.5px;font-weight:800;padding:1px 7px;border-radius:999px;background:#e8e4da;color:#7a7264}
  .hbadge.live{background:#e2f5e9;color:#1d7a4c}
  .hbadge.end{background:#eef1f4;color:#66707c}
  .hbadge.fail{background:#fbe7e7;color:#b03a3a}
  .tsub{position:relative;margin-top:4px;padding:4px 56px 4px 10px;background:#faf6ea;border-radius:8px;font-size:11.5px;color:var(--ink2)}
  .tsub .hbadge{top:4px}
  .pmeta{display:flex;flex-direction:column;line-height:1.2;min-width:0}
  .pname{font-size:10.5px;font-weight:800;color:var(--ink);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:78px}
  .prow{display:flex;gap:6px;align-items:baseline}
  .pstate{font-size:9px;color:var(--dim);letter-spacing:.6px;white-space:nowrap}
  .pchg{border:0;background:none;cursor:pointer;font-size:9.5px;color:#1f9d84;
    font-weight:800;padding:0;white-space:nowrap}
  .pnote{position:absolute;font-size:13px;color:#1f9d84;opacity:0;pointer-events:none;font-weight:800}
  .player.playing .pnote{animation:float-note 2.6s ease-in infinite}
  /* ---------- wall clock: live iOS-style overlay on the rendered disc
     (disc centre -7.7, 4.55 r 0.30 in the render; overlay r 0.35) ---------- */
  .wclock{position:absolute;z-index:3;left:7.222%;top:54.040%;width:3.889%;aspect-ratio:1/1;
    transform:translate(-50%,-50%);pointer-events:none;
    filter:drop-shadow(0 2px 3px rgba(31,58,95,.28))}
  .pnote.n1{left:8px;top:-10px}
  .pnote.n2{left:26px;top:-14px;animation-delay:.9s;font-size:11px}
  .pnote.n3{left:-2px;top:-6px;animation-delay:1.7s;font-size:10px}
  @keyframes float-note{0%{opacity:0;transform:translateY(4px) rotate(-6deg)}
    25%{opacity:.9}100%{opacity:0;transform:translateY(-20px) rotate(8deg)}}
  .zzz{position:absolute;left:64%;top:-16%;z-index:6;color:#5b8dd9;font-weight:800;font-size:15px;
    letter-spacing:.5px;text-shadow:0 1px 2px rgba(255,255,255,.8);animation:zzz 2.6s ease-in-out infinite}
  .zzz sup{font-size:10px}

  /* v4.2: staggered tags, fat-finger hit areas, clickable racks,
     persistent model movers (walk transitions), player name marquee */
  .tag.up{margin-bottom:11px}
  .hit{position:absolute;inset:-10px -5px;z-index:9;border-radius:12px}
  .rack-btn{position:absolute;z-index:4;background:none;border:none;padding:0;cursor:pointer;
    border-radius:6px;-webkit-tap-highlight-color:transparent}
  .rack-btn:hover{background:rgba(140,200,255,.13);box-shadow:inset 0 0 0 1.5px rgba(140,200,255,.45)}
  .rack-btn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .movers{position:absolute;inset:0;z-index:3;pointer-events:none}
  .movers .fig,.movers .sleeper{pointer-events:auto}
  .mover{transition:left 1.05s cubic-bezier(.45,.02,.3,1),top 1.05s cubic-bezier(.45,.02,.3,1),opacity .5s ease}
  .mover.noanim{transition:none}
  .mover.gone{opacity:0}
  .mover.walking .fig-in,.mover.walking .sleeper-in{animation:walkbob .34s ease-in-out infinite alternate}
  @keyframes walkbob{from{transform:translateY(0)}to{transform:translateY(-4.5%)}}
  .pname .ptxt{display:inline-block}
  .pname.long .ptxt{animation:pmarquee 7s ease-in-out infinite}
  @keyframes pmarquee{0%,18%{transform:translateX(0)}82%,100%{transform:translateX(calc(-100% + 74px))}}
  @keyframes zzz{0%{transform:translateY(2px);opacity:.35}45%{opacity:1}100%{transform:translateY(-4px);opacity:.3}}

  /* ---------- basement LCD panel ---------- */
  .lcd-panel{position:absolute;z-index:5;border-radius:10px;padding:1.1% 1.4%;cursor:pointer;
    background:linear-gradient(155deg,rgba(13,24,38,.93),rgba(20,34,50,.95));
    border:1px solid rgba(130,185,240,.4);box-shadow:0 6px 18px rgba(20,40,70,.35), inset 0 1px 0 rgba(160,210,255,.18);
    color:#cfe6ff;display:flex;flex-direction:column;justify-content:center;gap:3%}
  .lcd-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .lcd-row .k{font-size:10px;letter-spacing:1.6px;color:#8fb4d8;font-weight:700;white-space:nowrap}
  .lcd-row .num{font-family:ui-monospace,Consolas,monospace;font-size:clamp(11px,1.35vw,16px);
    font-weight:800;color:#8fd8ff;font-variant-numeric:tabular-nums;white-space:nowrap}
  .lcd-svcs{display:flex;flex-direction:column;gap:2px;margin-top:1%}
  .lcd-svc{display:flex;align-items:center;gap:7px;font-size:11px;color:#b9d6f2}
  .lcd-svc .sdot{width:8px;height:8px;border-radius:50%;flex:none;background:#5f7a94}
  .lcd-svc .sdot.ok{background:var(--green);box-shadow:0 0 7px rgba(47,191,113,.9)}
  .lcd-svc .sdot.off{background:var(--red);box-shadow:0 0 5px rgba(224,101,95,.55)}
  .lcd-svc .sst{margin-left:auto;font-size:10.5px;font-weight:700}
  .lcd-svc .sst.ok{color:#3ddc84}.lcd-svc .sst.off{color:#ff8a80}.lcd-svc .sst.unk{color:#8496a9}

  /* ---------- detail modal (bright glass, same as v3) ---------- */
  .overlay{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:18px;
    background:rgba(80,110,150,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .overlay.show{display:grid}
  .modal{width:min(470px,100%);max-height:86vh;overflow:auto;padding:20px 20px 14px;border-radius:18px;
    background:linear-gradient(165deg,rgba(255,255,255,.97),rgba(255,250,238,.96));
    border:1.5px solid #ffffff;box-shadow:0 26px 60px rgba(60,80,120,.35)}
  .modal.has-art{width:min(610px,100%)}
  .m-flex{display:flex;gap:16px;align-items:stretch}
  .m-art{display:none;width:158px;flex:none;border-radius:14px;overflow:hidden;
    background:#eef3f8;border:1px solid #e3ebf2}
  .modal.has-art .m-art{display:block}
  .m-art img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
  .m-main{flex:1;min-width:0}
  @media (max-width:560px){ .m-art{width:106px} }
  .modal-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
  .avatar{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;
    font-size:16px;font-weight:800;color:#fff;background:var(--acc,#2ea88a);
    border:2px solid #fff;box-shadow:0 3px 8px rgba(90,60,30,.25);overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .modal-title{font-size:15.5px;font-weight:800;color:var(--ink);letter-spacing:.4px;line-height:1.35;overflow-wrap:anywhere}
  .modal-sub{font-size:11.5px;color:var(--dim);margin-top:2px}
  .modal-close{margin-left:auto;flex:none;width:30px;height:30px;border-radius:9px;cursor:pointer;
    background:#fff;border:1.5px solid var(--line);color:var(--dim);font-size:14px;line-height:1}
  .modal-close:hover{border-color:var(--dim);color:var(--ink)}
  .srow{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
    padding:8px 0;border-bottom:1px solid #f0e6cf}
  .srow:last-child{border-bottom:none}
  .srow .sl{font-size:11.5px;color:var(--dim);letter-spacing:.8px;flex:none}
  .srow .sv{font-size:12.5px;color:var(--ink);font-weight:700;text-align:right;
    font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .note-box{margin-top:12px;padding:10px 13px;border-radius:11px;font-size:11.5px;line-height:1.6;
    color:#7a6748;background:#fdf6e0;border:1.5px dashed #dccbaa}

  footer{margin-top:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
    font-size:10.5px;letter-spacing:.6px;color:#5b7a99;padding:0 4px}

  @media(max-width:680px){
    body{padding:12px 8px 18px}
    .brand h1{font-size:16px}
    .brand p{display:none}
    .counts{margin-left:0;font-size:11.5px}
    header.topbar{padding:9px 12px;gap:10px}
  }
  @media(prefers-reduced-motion:reduce){
    .fig.working .fig-in,.fig.resident .fig-in,.zzz,.cloud,.linkchip .dot,.fig .halo{animation:none}
    .mover{transition:none}
    .pname.long .ptxt{animation:none}
  }
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="cloud" style="width:150px;height:38px;top:6%;left:6%"></div>
  <div class="cloud" style="width:210px;height:46px;top:13%;left:58%;animation-duration:110s"></div>
  <div class="cloud" style="width:110px;height:30px;top:3%;left:82%;animation-duration:75s"></div>
  <div class="cloud" style="width:180px;height:42px;top:20%;left:26%;animation-duration:130s;opacity:.6"></div>
</div>

          <g id="clkS"><line x1="50" y1="62" x2="50" y2="9" stroke="#ff9f0a" stroke-width="1.8" stroke-linecap="round"/></g>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">

<script>
  "use strict";
  var API = "/api/plugins/bot-office/state";
  var overlay = document.getElementById('overlay');
  var lastState = null, selectedId = null, pollTimer = null;

  /* ---------- surveyed anchors from the Blender scene (meters) ----------
     view: 18.0 m wide x 13.341 m high, frame top at z = 12.97 */
  function X(x) { return ((x + 9) / 18 * 100).toFixed(3) + "%"; }
  function Y(z) { return ((9.9 - z) / 9.9 * 100).toFixed(3) + "%"; }
  var DESKS = [-7.85, -4.85, -1.85];                    // chair x per station, office floor z 5.1
  var OFFICE_STAND = [0.5, 2.55];
  var BEDS = [   // bunk beds: az = sleeper anchor height (lower / upper berth)
    {x: 1.3, az: 2.96}, {x: 1.3, az: 4.10},
    {x: 4.2, az: 2.96}, {x: 4.2, az: 4.10},
    {x: 7.1, az: 2.96}, {x: 7.1, az: 4.10}
  ];
  var DORM_STAND = [0.0];
  var SPOTS = {
    dispatch: [{x: -4.8, z: 2.3}],
    archive: [{x: 6.9, z: 5.1}]
  };
  var LCD = {x0: 0.6, x1: 8.2, z0: 0.35, z1: 1.95};

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c];
    });
  }
  var SHIRTS = ["#c94f4f", "#3da87c", "#4a86c5", "#d98f35", "#8d5aa8", "#319a92", "#d0713a", "#d1548a"];
  var HAIRS = ["#3a2e28", "#5a4232", "#8a5a34", "#c9a227", "#707880", "#a34a5e", "#2e4a6b"];
  var SKINS = ["#f2c297", "#e8ab7c", "#d99e6b"];
  function pick(arr, key) {
    var h = 0;
    for (var i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
    return arr[h % arr.length];
  }
  function accentFor(p) { return p.shirt || pick(SHIRTS, p.id || p.name || ""); }
  function hairFor(p) { return p.hair || pick(HAIRS, p.id || p.name || ""); }
  function skinFor(p) { return pick(SKINS, p.id || p.name || ""); }
  function shade(hex, f) {
    var n = parseInt(hex.slice(1), 16);
    var r = Math.min(255, Math.max(0, Math.round(((n >> 16) & 255) * f)));
    var g = Math.min(255, Math.max(0, Math.round(((n >> 8) & 255) * f)));
    var b = Math.min(255, Math.max(0, Math.round((n & 255) * f)));
    return "rgb(" + r + "," + g + "," + b + ")";
  }
  function initialFor(name) {
    var s = String(name == null ? "" : name).trim();
    return s ? s.charAt(0).toUpperCase() : "?";
  }
  function fmtTokens(n) {
    if (n == null) return "—";
    if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
    return String(n);
  }
  function fmtClock(epochS) {
    if (!epochS) return "—";
    var d = new Date(epochS * 1000);
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  function fmtDateTime(sec) {
    if (!sec) return "—";
    var d = new Date(sec * 1000);
    return String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") + " " +
      String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  function fmtAgo(epochS) {
    if (!epochS) return "无记录";
    var s = Math.max(0, Math.floor(Date.now() / 1000) - epochS);
    if (s < 60) return s + " 秒前";
    if (s < 3600) return Math.floor(s / 60) + " 分钟前";
    if (s < 86400) return Math.floor(s / 3600) + " 小时前";
    return Math.floor(s / 86400) + " 天前";
  }
  function fmtUptime(sec) {
    if (sec == null) return "—";
    var d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
    return (d ? d + " 天 " : "") + h + " 小时 " + m + " 分";
  }

  /* ---------- overlay builders ---------- */
  function chipHTML(name, sub, x, z) {
    return '<div class="chip" style="left:' + X(x) + ';top:' + Y(z) + '">' + esc(name) +
      (sub ? '<span class="sub">' + esc(sub) + '</span>' : '') + '</div>';
  }
  function tagShift(x) {
    if (x < -6.2) return ' style="transform:translateX(-18%)"';
    if (x > 6.2) return ' style="transform:translateX(-82%)"';
    return '';
  }
  /* persona art per model family (falls back to CSS figures when absent) */
  var PERSONAS = [
    {match: "nemotron", avatar: "avatar-nemotron.png", full: "persona-nemotron.webp"},
    {match: "glm", avatar: "avatar-glm.png", full: "persona-glm.webp"},
    {match: "deepseek", avatar: "avatar-deepseek.png", full: "persona-deepseek.webp"}
  ];
  function personaFor(p) {
    if (!p || p.kind !== "model") return null;
    var key = ((p.model || "") + " " + (p.name || "")).toLowerCase();
    for (var i = 0; i < PERSONAS.length; i++)
      if (key.indexOf(PERSONAS[i].match) >= 0) return PERSONAS[i];
    return null;
  }
  function avatarFor(p) { return p && p.name === "调度员" ? "avatar-dispatch.png" : null; }
  function figInner(p, mode, x, lift) {
    var per = personaFor(p) || (avatarFor(p) ? {art: null, avatar: avatarFor(p)} : null);
    var tag = '<span class="tag' + (lift ? ' up' : '') + '"' + tagShift(x) + '>' +
      (p.status === "working" ? '<span class="wdot"></span>' : '') + esc(p.name) + '</span>';
    if (per) {
      return '<span class="hit"></span><span class="fig-in">' +
        (p.status === "working" ? '<span class="halo"></span>' : '') + tag +
        '<span class="pava"><img src="' + per.avatar + '" alt=""></span></span>';
    }
    return '<span class="hit"></span><span class="fig-in">' +
      (p.status === "working" ? '<span class="halo"></span>' : '') + tag +
      '<span class="chibi">' + chibiSVG(p, mode) + '</span></span>';
  }
  function figHTML(p, mode, x, zBottom, lift) {
    var per = personaFor(p) || (avatarFor(p) ? {art: null, avatar: avatarFor(p)} : null);
    var cls = "fig " + mode + (per ? " persona" : "") +
      (p.kind === "static" ? " resident" : (p.status === "working" ? " working" : ""));
    return '<button class="' + cls + '" data-id="' + esc(p.id) + '" title="' + esc(p.name) +
      '" style="left:' + X(x) + ';top:' + Y(zBottom) + '">' +
      figInner(p, mode, x, lift) + '</button>';
  }
  /* anime chibi figure in the same illustration family as the personas */
  function hairStyleOf(p) { return pick(["short", "long", "bun"], (p.id || p.name || "") + "hair"); }
  function chibiHead(p, sleeping) {
    var skin = skinFor(p), hair = hairFor(p);
    var st = hairStyleOf(p);
    var s = "";
    if (st === "bun") s += '<circle cx="32" cy="6" r="8" fill="' + hair + '"/>';
    s += '<circle cx="32" cy="26" r="19" fill="' + hair + '"/>';
    s += '<circle cx="32" cy="30" r="15.5" fill="' + skin + '"/>';
    if (st !== "short") {
      var lk = st === "long" ? 22 : 13;
      s += '<rect x="12.5" y="24" width="6" height="' + lk + '" rx="3" fill="' + hair + '"/>' +
           '<rect x="45.5" y="24" width="6" height="' + lk + '" rx="3" fill="' + hair + '"/>';
    }
    if (sleeping) {
      s += '<path d="M20 31 Q24 33.5 28 31" stroke="#4a3a34" stroke-width="1.7" fill="none" stroke-linecap="round"/>' +
           '<path d="M36 31 Q40 33.5 44 31" stroke="#4a3a34" stroke-width="1.7" fill="none" stroke-linecap="round"/>' +
           '<circle cx="32" cy="37.5" r="1.6" fill="#b06a5a"/>';
    } else {
      s += '<ellipse cx="24.5" cy="30" rx="2.3" ry="3.6" fill="#33291f"/>' +
           '<ellipse cx="39.5" cy="30" rx="2.3" ry="3.6" fill="#33291f"/>' +
           '<circle cx="23.6" cy="28.4" r="1" fill="#fff"/><circle cx="38.6" cy="28.4" r="1" fill="#fff"/>' +
           '<path d="M28.5 36.5 Q32 38.6 35.5 36.5" stroke="#b06a5a" stroke-width="1.5" fill="none" stroke-linecap="round"/>';
    }
    s += '<ellipse cx="19" cy="35" rx="3.2" ry="1.9" fill="#f2a0a0" opacity=".55"/>' +
         '<ellipse cx="45" cy="35" rx="3.2" ry="1.9" fill="#f2a0a0" opacity=".55"/>';
    return s;
  }
  function chibiSVG(p, mode) {
    var shirt = accentFor(p), skin = skinFor(p);
    var dark = shade(shirt, 0.78), pants = "#46536b";
    var s = "";
    if (hairStyleOf(p) === "long")
      s += '<rect x="9" y="14" width="46" height="36" rx="15" fill="' + hairFor(p) + '"/>';
    if (mode === "stand") {
      s += '<rect x="23" y="80" width="7" height="17" rx="3" fill="' + pants + '"/>' +
           '<rect x="34" y="80" width="7" height="17" rx="3" fill="' + pants + '"/>' +
           '<ellipse cx="26.5" cy="99.5" rx="5.5" ry="3.4" fill="#333a45"/>' +
           '<ellipse cx="37.5" cy="99.5" rx="5.5" ry="3.4" fill="#333a45"/>';
    }
    s += '<rect x="9" y="50" width="8" height="26" rx="4" fill="' + dark + '"/>' +
         '<rect x="47" y="50" width="8" height="26" rx="4" fill="' + dark + '"/>' +
         '<circle cx="13" cy="78" r="3.4" fill="' + skin + '"/><circle cx="51" cy="78" r="3.4" fill="' + skin + '"/>' +
         '<rect x="28" y="40" width="8" height="8" fill="' + shade(skin, 0.88) + '"/>' +
         '<rect x="15" y="46" width="34" height="38" rx="11" fill="' + shirt + '"/>' +
         '<path d="M25 46 h14 l-7 8 z" fill="#ffffff" opacity=".92"/>';
    if (mode === "seated") s += '<rect x="17" y="70" width="30" height="12" rx="5" fill="' + pants + '"/>';
    s += chibiHead(p, false);
    return '<svg viewBox="0 0 64 ' + (mode === "stand" ? 104 : 84) + '" aria-hidden="true">' + s + '</svg>';
  }
  function sleeperInner(p, isModel, x, lift) {
    var per = personaFor(p);
    var tag = '<span class="tag' + (lift ? ' up' : '') + '"' + tagShift(x) + '>' + esc(p.name) + '</span>';
    if (per) {
      return '<span class="hit"></span><span class="sleeper-in">' + tag +
        '<span class="zzz">Z<sup>z</sup></span>' +
        '<span class="pava"><img src="' + per.avatar + '" alt=""></span></span>';
    }
    var shirt = accentFor(p);
    return '<span class="hit"></span><span class="sleeper-in">' + tag +
      (isModel ? '<span class="zzz">Z<sup>z</sup></span>' : '') +
      '<span class="chead"><svg viewBox="0 0 64 52" aria-hidden="true">' + chibiHead(p, true) + '</svg></span>' +
      '<span class="capsule" style="background:linear-gradient(180deg,' + shade(shirt, 1.2) + ',' + shirt + ' 60%,' + shade(shirt, 0.75) + ')"></span>' +
      '</span>';
  }
  function sleeperHTML(p, isModel, bed, lift) {
    var per = personaFor(p);
    return '<button class="sleeper' + (per ? ' persona-s' : '') + '" data-id="' + esc(p.id) + '" title="' + esc(p.name) +
      '" style="left:' + X(bed.x) + ';top:' + Y(bed.az) + '">' +
      sleeperInner(p, isModel, bed.x, lift) + '</button>';
  }

  /* ---------- model movers: persistent nodes so models visibly walk
     between desk / dorm bed / hall when their status flips ---------- */
  var movers = {};
  var moversEl = document.getElementById('movers');
  function syncMovers(place) {
    var seen = {};
    Object.keys(place).forEach(function (id) {
      seen[id] = true;
      var pl = place[id], p = pl.p;
      var per = personaFor(p), cls, inner;
      if (pl.form === "bed") {
        cls = "sleeper mover" + (per ? " persona-s" : "");
        inner = sleeperInner(p, true, pl.x, pl.lift);
      } else {
        cls = "fig mover " + pl.form + (per ? " persona" : "") + (p.status === "working" ? " working" : "");
        inner = figInner(p, pl.form, pl.x, pl.lift);
      }
      var sig = cls + "|" + p.name + "|" + (pl.lift ? "u" : "-");
      var mv = movers[id];
      if (!mv) {
        var el = document.createElement("button");
        el.className = cls;
        el.dataset.id = id;
        el.title = p.name || "";
        el.innerHTML = inner;
        el.style.transition = "none";
        el.style.left = X(pl.x);
        el.style.top = Y(pl.z);
        el.addEventListener("click", function () { openDetail(id); });
        moversEl.appendChild(el);
        void el.offsetWidth; /* commit the start position before arming transitions */
        el.style.transition = "";
        movers[id] = mv = {el: el, sig: sig, x: pl.x, z: pl.z, walkT: null};
        return;
      }
      var el2 = mv.el;
      el2.classList.remove("gone");
      var moved = mv.x !== pl.x || mv.z !== pl.z;
      if (mv.sig !== sig) {
        var wasWalking = el2.classList.contains("walking");
        el2.className = cls + (wasWalking ? " walking" : "");
        el2.innerHTML = inner;
        el2.title = p.name || "";
        mv.sig = sig;
        moved = true;
      }
      if (moved) {
        el2.style.left = X(pl.x);
        el2.style.top = Y(pl.z);
        mv.x = pl.x; mv.z = pl.z;
        el2.classList.add("walking");
        if (mv.walkT) clearTimeout(mv.walkT);
        mv.walkT = setTimeout(function () { el2.classList.remove("walking"); }, 1150);
      }
    });
    Object.keys(movers).forEach(function (id) {
      if (seen[id]) return;
      var mv = movers[id];
      mv.el.classList.add("gone");
      setTimeout(function () {
        if (!mv.el.classList.contains("gone")) return;
        if (mv.el.parentNode) mv.el.parentNode.removeChild(mv.el);
        if (movers[id] === mv) delete movers[id];
      }, 600);
    });
  }
  function svcState(s) {
    if (s.present === true) return {cls: "ok", txt: "在运行"};
    if (s.present === false) return {cls: "off", txt: "未发现"};
    return {cls: "unk", txt: "未知"};
  }
  function lcdRow(k, v) {
    return '<div class="lcd-row"><span class="k">' + esc(k) + '</span>' +
      '<span class="num">' + esc(v) + '</span></div>';
  }
  function lcdHTML(cab) {
    var h = '<div class="lcd-panel" data-id="' + esc(cab.id) + '" role="button" title="' + esc(cab.name) +
      '" style="left:' + X(LCD.x0) + ';top:' + Y(LCD.z1) + ';width:' + ((LCD.x1 - LCD.x0) / 18 * 100) +
      '%;height:' + ((LCD.z1 - LCD.z0) / 9.9 * 100) + '%">';
    h += lcdRow("CPU 使用率", cab.cpu != null ? cab.cpu + " %" : "—");
    h += lcdRow("内存 MEMORY", cab.ram ? (cab.ram.usedPct + " % · " + cab.ram.usedGB + "/" + cab.ram.totalGB + " GB") : "—");
    h += lcdRow("运行时间 UPTIME", fmtUptime(cab.uptimeSec));
    var svcs = cab.services || [];
    if (svcs.length) {
      h += '<div class="lcd-svcs">' + svcs.map(function (s) {
        var st = svcState(s);
        return '<div class="lcd-svc"><span class="sdot ' + st.cls + '"></span>' +
          '<span>' + esc(s.name) + '</span>' +
          '<span class="sst ' + st.cls + '">' + st.txt + '</span></div>';
      }).join("") + '</div>';
    }
    return h + '</div>';
  }

  /* ---------- render ---------- */
  function render(state) {
    var byId = {}, modelsRoom = null;
    (state.rooms || []).forEach(function (r) {
      byId[r.id] = r;
      if (r.kind === "models") modelsRoom = r;
    });
    var h = "";
    /* zone labels */
    h += chipHTML("办公区", modelsRoom ? modelsRoom.name + " · 模型实时" : "", -8.35, 7.7);
    h += chipHTML("档案室", "历史档案", 3.55, 7.7);
    var dormRoom = byId['dorm'];
    h += chipHTML(dormRoom ? dormRoom.name : "员工宿舍", "休息区", -0.95, 4.92);
    h += chipHTML(byId['dispatch'] ? byId['dispatch'].name : "调度中心", "", -2.85, 4.92);
    h += chipHTML("机房", "基础设施 · 主机采样", -8.35, 2.12);

    /* office: working models at desks, overflow standing.
       Models are placed as persistent movers (they walk on status flips);
       only static residents are rebuilt with the overlay each poll. */
    var people = modelsRoom ? (modelsRoom.people || []) : [];
    var working = people.filter(function (p) { return p.status === "working"; });
    var idle = people.filter(function (p) { return p.status !== "working"; });
    var place = {};
    working.forEach(function (p, i) {
      if (i < DESKS.length)
        place[p.id] = {p: p, form: "seated", x: DESKS[i], z: 5.58, lift: i % 2 === 1};
      else
        place[p.id] = {p: p, form: "stand", x: OFFICE_STAND[(i - DESKS.length) % OFFICE_STAND.length], z: 5.12, lift: i % 2 === 1};
    });
    if (!state.link) {
      h += '<div class="note alert" style="left:' + X(-3.4) + ';top:' + Y(6.5) + '">数据离线 · STATE.DB 暂不可用</div>';
    } else if (!working.length) {
      h += '<div class="note" style="left:' + X(-3.4) + ';top:' + Y(6.1) + '">' +
        (people.length ? "模型都在休息 · 宿舍里见" : "暂无会话记录") + '</div>';
    }

    /* dorm: idle models first, then residents; overflow stands in the lobby */
    var sleepers = idle.concat(dormRoom ? (dormRoom.people || []) : []);
    sleepers.forEach(function (p, i) {
      var lift = i % 2 === 1;
      if (i < BEDS.length) {
        if (p.kind === "model")
          place[p.id] = {p: p, form: "bed", x: BEDS[i].x, z: BEDS[i].az, lift: lift};
        else h += sleeperHTML(p, false, BEDS[i], lift);
      } else {
        var hx = DORM_STAND[(i - BEDS.length) % DORM_STAND.length];
        if (p.kind === "model")
          place[p.id] = {p: p, form: "stand", x: hx, z: 2.32, lift: lift};
        else h += figHTML(p, "stand", hx, 2.32, lift);
      }
    });

    /* static duty posts: dispatch + archive room */
    var life = 0;
    ["dispatch", "archive"].forEach(function (key) {
      var room = byId[key];
      var folks = room ? (room.people || []) : [];
      if (key === "dispatch") life += folks.length;
      var spots = SPOTS[key];
      if (!spots) return;
      folks.forEach(function (p, i) {
        var s = spots[Math.min(i, spots.length - 1)];
        var dx = i >= spots.length ? 0.62 * (i - spots.length + 1) : 0;
        var fh = figHTML(p, "stand", s.x + dx, s.z + 0.02, i % 2 === 1);
        if (key === "dispatch") fh = fh.replace('class="fig ', 'class="fig dispatch-fig ');
        h += fh;
      });
    });

    /* basement: LCD panel from the first host cabinet */
    var hostRooms = (state.rooms || []).filter(function (r) { return r.kind === "host"; });
    var cab = null;
    hostRooms.forEach(function (r) { (r.cabinets || []).forEach(function (c) { if (!cab) cab = c; }); });
    if (cab) {
      h += lcdHTML(cab);
      for (var ri = 0; ri < 6; ri++) {
        var rcx = -7.55 + ri * 1.32;
        h += '<button class="rack-btn" data-id="' + esc(cab.id) + '" title="' + esc(cab.name) +
          '" style="left:' + X(rcx - 0.57) + ';top:' + Y(1.95) + ';width:6.333%;height:11.99%"></button>';
      }
    }

    document.getElementById('ovl').innerHTML = h;
    syncMovers(place);
    document.getElementById('zOffice').textContent = working.length;
    document.getElementById('zDorm').textContent = sleepers.length;
    document.getElementById('zLife').textContent = life;
    var now = new Date();
    document.getElementById('kClock').textContent =
      String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
    document.getElementById('linkChip').classList.toggle('off', !state.link);
    document.getElementById('linkLabel').textContent = state.link ? "已连接" : "数据离线";
    document.getElementById('footState').textContent =
      state.link ? "state.db 已连接 · 每 15 秒刷新" : "state.db 离线 · 每 15 秒重试";
    bindClicks();
    if (selectedId) refreshDetail();
  }

  /* ---------- detail modal (same data & rows as UI v3) ---------- */
  function findEntity(id) {
    var found = null;
    (lastState.rooms || []).forEach(function (r) {
      (r.people || []).forEach(function (p) { if (p.id === id) found = {type: "person", v: p, room: r}; });
      (r.cabinets || []).forEach(function (cab) { if (cab.id === id) found = {type: "cabinet", v: cab, room: r}; });
    });
    return found;
  }
  function srow(label, value) {
    return '<div class="srow"><span class="sl">' + esc(label) + '</span>' +
      '<span class="sv">' + esc(value) + '</span></div>';
  }
  function detailFor(ent) {
    if (!ent) return null;
    if (ent.type === "cabinet") {
      var cab = ent.v, rows = "";
      rows += srow("CPU", cab.cpu != null ? cab.cpu + " %" : "无采样");
      rows += srow("内存", cab.ram ? (cab.ram.usedGB + " / " + cab.ram.totalGB + " GB（" + cab.ram.usedPct + "%）") : "无采样");
      rows += srow("已运行", fmtUptime(cab.uptimeSec));
      (cab.services || []).forEach(function (s) {
        rows += srow("服务 · " + s.name, s.present === true ? "进程在运行" : (s.present === false ? "未发现进程" : "未知（本平台无采样）"));
      });
      return {acc: "#2ea88a", initial: "机", title: cab.name, sub: (ent.room.name || "基础设施") + " · 主机柜", body: rows};
    }
    var p = ent.v;
    if (p.tasks) {
      var t = p.tasks;
      function tbadge(st) {
        var v = String(st == null ? "" : st).toLowerCase();
        if (v === "running" || v === "in_progress" || v === "active") return '<span class="hbadge live">进行中</span>';
        if (v === "done" || v === "completed" || v === "success" || v === "finished") return '<span class="hbadge end">已完成</span>';
        if (v === "failed" || v === "error") return '<span class="hbadge fail">失败</span>';
        if (v === "cancelled" || v === "canceled") return '<span class="hbadge">已取消</span>';
        if (v === "archived") return '<span class="hbadge">已归档</span>';
        if (v === "waiting" || v === "pending" || v === "queued") return '<span class="hbadge">待处理</span>';
        return '<span class="hbadge">' + esc(st == null ? "—" : st) + '</span>';
      }
      var trows = "";
      trows += srow("主线任务", t.mainCount + " 条");
      trows += srow("Subagent 子任务", t.subCount + " 条");
      trows += '<div class="hist">' + (t.mains || []).map(function (m) {
        var subs = (m.subs || []).map(function (sb) {
          return '<div class="tsub">↳ ' + esc(sb.title || "（无标题子任务）") + tbadge(sb.status) + '</div>';
        }).join("");
        return '<div class="hrow"><div class="ht">' + esc(m.title || "（无标题任务）") + '</div>' +
          '<div class="hm">最近活动 ' + fmtDateTime(m.updatedAt) + '</div>' + tbadge(m.status) + subs + '</div>';
      }).join("") + '</div>';
      trows += '<div class="note-box">' + (t.subSource
        ? "数据来自 state.db（只读）：主线任务与 subagent 子任务按父子关系分组；状态为库内原始状态。"
        : "当前库中没有子任务数据源，下面只列主线（会话）；日后有 subagent 父子记录时会自动分组成子任务。") + '</div>';
      return {acc: accentFor(p), initial: initialFor(p.name), title: p.name,
        sub: (ent.room.name || "") + " · 任务调度", body: trows};
    }
    if (p.archive) {
      var a = p.archive, arows = "";
      arows += srow("历史会话总数", a.total);
      arows += srow("已归档", a.archived != null ? a.archived + " 条" : "库中无归档标记");
      if (a.ended != null) arows += srow("已结束", a.ended + " 条");
      if (a.active != null) arows += srow("进行中", a.active + " 条");
      arows += '<div class="hist">' + (a.history || []).map(function (hh) {
        var badge = hh.archived === true ? '<span class="hbadge">已归档</span>'
          : (hh.endedAt ? '<span class="hbadge end">已结束</span>' : '<span class="hbadge live">进行中</span>');
        return '<div class="hrow"><div class="ht">' + esc(hh.title || "（无标题会话）") + '</div>' +
          '<div class="hm">' + fmtDateTime(hh.startedAt) + ' · ' + esc(hh.model) + ' · ' +
          hh.messages + ' 条消息 · ' + fmtTokens(hh.tokens) + ' 令牌</div>' + badge + '</div>';
      }).join("") + '</div>';
      arows += '<div class="note-box">数据来自 state.db 的会话元数据（只读）：时间、模型、计数与标题；不读取对话正文。</div>';
      return {acc: accentFor(p), initial: initialFor(p.name), title: p.name, sub: (ent.room.name || "") + " · 历史档案", body: arows};
    }
    if (p.kind === "static") {
      return {acc: accentFor(p), initial: initialFor(p.name), title: p.name,
              sub: (ent.room.name || "") + " · 静态职责",
              body: srow("职责", p.role || "—") +
                '<div class="note-box">静态职责 · 暂无数据接口<br>本房间为职责展示，不冒充实时状态。</div>'};
    }
    var st = p.stats || {};
    var rows = "";
    rows += srow("模型", p.model || "—");
    rows += srow("状态", p.status === "working" ? "工作中" : "空闲");
    rows += srow("会话", (st.sessions != null ? st.sessions : "—") + "（进行中 " + (st.activeSessions != null ? st.activeSessions : "—") + "）");
    rows += srow("今日工具调用", st.toolsToday == null ? "—" : st.toolsToday);
    rows += srow("累计工具调用", st.toolCalls != null ? st.toolCalls : "—");
    rows += srow("消息", st.messages != null ? st.messages : "—");
    rows += srow("令牌", fmtTokens(st.tokens));
    rows += srow("最近活动", fmtClock(st.lastActive) + "（" + fmtAgo(st.lastActive) + "）");
    return {acc: accentFor(p), initial: initialFor(p.name), title: p.name,
            sub: (ent.room.name || "") + " · " + (p.status === "working" ? "工作中" : "空闲"), body: rows};
  }
  function openDetail(id) { selectedId = id; refreshDetail(); }
  function refreshDetail() {
    var ent = findEntity(selectedId);
    var d = detailFor(ent);
    if (!d) { closeDetail(); return; }
    var per = ent && ent.type === "person" ? (personaFor(ent.v) || (avatarFor(ent.v) ? {art: null, avatar: avatarFor(ent.v)} : null)) : null;
    document.getElementById('modal').classList.toggle('has-art', !!(per && per.full));
    if (per && per.full) document.getElementById('mArt').src = per.full;
    var av = document.getElementById('mAvatar');
    if (per) av.innerHTML = '<img src="' + per.avatar + '" alt="">';
    else av.textContent = d.initial;
    av.style.setProperty('--acc', d.acc);
    document.getElementById('mTitle').textContent = d.title;
    document.getElementById('mSub').textContent = d.sub;
    document.getElementById('mBody').innerHTML = d.body;
    overlay.classList.add('show');
  }
  function closeDetail() { overlay.classList.remove('show'); selectedId = null; }
  document.getElementById('mClose').addEventListener('click', closeDetail);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeDetail(); });
  document.addEventListener('keydown', function (e) { if (e.key === "Escape") closeDetail(); });

  function bindClicks() {
    document.querySelectorAll('#ovl .fig,#ovl .sleeper,#ovl .lcd-panel,#ovl .rack-btn').forEach(function (el) {
      el.addEventListener('click', function () { openDetail(el.dataset.id); });
    });
  }

  function poll() {
    fetch(API, {headers: {"Accept": "application/json"}}).then(function (resp) {
      if (resp.status === 401) {
        clearInterval(pollTimer);
        document.getElementById('authHint').classList.add('show');
        document.getElementById('footState').textContent = "已停止刷新（401）";
        return null;
      }
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      return resp.json();
    }).then(function (state) {
      if (!state) return;
      lastState = state;
      render(state);
    }).catch(function () {
      document.getElementById('footState').textContent = "刷新失败 · 15 秒后重试";
    });
  }
  poll();
  pollTimer = setInterval(poll, 15000);

  /* ---------- wall clock: live, synced to the viewer's clock ---------- */
  (function () {
    var ticks = document.getElementById('clkTicks'), ns = 'http://www.w3.org/2000/svg', i, ln;
    for (i = 0; i < 12; i++) {
      ln = document.createElementNS(ns, 'line');
      var q = i % 3 === 0;
      ln.setAttribute('x1', 50); ln.setAttribute('x2', 50);
      ln.setAttribute('y1', q ? 5.5 : 7); ln.setAttribute('y2', q ? 12 : 10.5);
      ln.setAttribute('stroke', '#1c1c1e'); ln.setAttribute('stroke-width', q ? 3.4 : 1.8);
      ln.setAttribute('stroke-linecap', 'round');
      ln.setAttribute('transform', 'rotate(' + (i * 30) + ' 50 50)');
      ticks.appendChild(ln);
    }
    var H = document.getElementById('clkH'), M = document.getElementById('clkM'), S = document.getElementById('clkS');
    function tick() {
      var d = new Date(), sec = d.getSeconds() + d.getMilliseconds() / 1000,
          min = d.getMinutes() + sec / 60, hr = (d.getHours() % 12) + min / 60;
      S.setAttribute('transform', 'rotate(' + (sec * 6) + ' 50 50)');
      M.setAttribute('transform', 'rotate(' + (min * 6) + ' 50 50)');
      H.setAttribute('transform', 'rotate(' + (hr * 30) + ' 50 50)');
    }
    tick(); setInterval(tick, 100);
  })();

  /* ---------- office radio: local music player ----------
     The picked audio file is stored as a Blob in IndexedDB (this browser
     only, never uploaded); it survives reloads like HALOFLUX's local BGM.
     The storage key stays 'leisureTrack' (the player's original home was
     the leisure zone) so tracks saved before v4.3 keep loading. */
  var pAudio = document.getElementById('pAudio'),
      pFile = document.getElementById('pFile'),
      pWrap = document.getElementById('player'),
      pName = document.getElementById('pName'),
      pTxt = document.getElementById('pTxt'),
      pState = document.getElementById('pState'),
      pToggle = document.getElementById('pToggle'),
      trackURL = null;
  function idbOpen(cb) {
    var r = indexedDB.open('bot-office', 1);
    r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
    r.onsuccess = function () { cb(r.result); };
    r.onerror = function () { cb(null); };
  }
  function saveTrack(file) {
    idbOpen(function (db) {
      if (!db) return;
      db.transaction('kv', 'readwrite').objectStore('kv')
        .put({name: file.name, blob: file}, 'leisureTrack');
    });
  }
  function loadTrack() {
    idbOpen(function (db) {
      if (!db) return;
      var rq = db.transaction('kv').objectStore('kv').get('leisureTrack');
      rq.onsuccess = function () {
        var v = rq.result;
        if (v && v.blob) setTrack(v.blob, v.name, false);
      };
    });
  }
  function setTrack(blob, name, autoplay) {
    if (trackURL) URL.revokeObjectURL(trackURL);
    trackURL = URL.createObjectURL(blob);
    pAudio.src = trackURL;
    pTxt.textContent = name || "本地音乐";
    pName.classList.toggle('long', (name || "").length > 11);
    pState.textContent = "点 ♪ 播放";
    if (autoplay) playTrack();
  }
  function setPlaying(on) {
    pWrap.classList.toggle('playing', on);
    document.getElementById('stage').classList.toggle('music-on', on);
    pState.textContent = on ? "播放中" : (trackURL ? "已暂停" : "点 ♪ 选歌");
  }
  function playTrack() {
    pAudio.play().then(function () { setPlaying(true); })
      .catch(function () { setPlaying(false); });
  }
  pToggle.addEventListener('click', function () {
    if (!trackURL) { pFile.click(); return; }
    if (pAudio.paused) playTrack();
    else { pAudio.pause(); setPlaying(false); }
  });
  document.getElementById('pChange').addEventListener('click', function () { pFile.click(); });
  pFile.addEventListener('change', function () {
    var f = pFile.files && pFile.files[0];
    if (!f) return;
    saveTrack(f);
    setTrack(f, f.name, true);
    pFile.value = "";
  });
  pAudio.addEventListener('pause', function () { setPlaying(false); });
  loadTrack();
</script>
</body>
